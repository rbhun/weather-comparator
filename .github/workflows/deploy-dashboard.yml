# Publish the offline dashboard so it can be opened from any browser.
# Site root is the contents of dashboard/ (index.html, data.js, vendor/, tiles/).
#
# After a successful deploy the site is at:
#   https://rbhun.github.io/weather-comparator/
#
# If the first run fails with "Pages site failed / Not Found", set
# Settings → Pages → Source to "GitHub Actions" once, then re-run this workflow.

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create/enable the Pages site on first run when missing.
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
